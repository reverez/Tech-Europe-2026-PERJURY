[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "perjury"
version = "0.1.0"
description = "Autonomous adversarial test-hardening agent for the Tech Europe 2026 Agentic AI Hack"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-ai==2.46.0",
  "modal==1.5.5",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
