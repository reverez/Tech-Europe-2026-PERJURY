[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perjury"
version = "0.1.0"
description = "Autonomous adversarial test-hardening agent for the Tech Europe 2026 Agentic AI Hack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-ai>=1.0",
  "modal>=1.0",
  "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
